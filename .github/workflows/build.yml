name: Multi-Platform Native Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build Tekst and TK on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -o build/tekst tekst/tekst.cpp
          g++ -std=c++17 -O2 -o build/tk tk/tk.cpp

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p build
          clang++ -std=c++17 -O2 -o build/tekst tekst/tekst.cpp
          clang++ -std=c++17 -O2 -o build/tk tk/tk.cpp

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /std:c++17 /O2 /EHsc /Fe:build\tekst.exe tekst\tekst.cpp
          cl /std:c++17 /O2 /EHsc /Fe:build\tk.exe tk\tk.cpp

      - name: Upload Linux Tekst
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-linux
          path: build/tekst

      - name: Upload Linux TK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-linux
          path: build/tk

      - name: Upload macOS Tekst
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-macos
          path: build/tekst

      - name: Upload macOS TK
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-macos
          path: build/tk

      - name: Upload Windows Tekst
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-windows
          path: build/tekst.exe

      - name: Upload Windows TK
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-windows
          path: build/tk.exe
