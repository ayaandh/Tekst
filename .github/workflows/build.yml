name: Multi-Platform Native Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build Tekst and TK on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Locate Tekst and TK
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            tekst=$(find build -type f -iname "tekst.exe" -print -quit)
            tk=$(find build -type f -iname "tk.exe" -print -quit)
          else
            tekst=$(find build -type f -name "tekst" -perm -111 -print -quit)
            tk=$(find build -type f -name "tk" -perm -111 -print -quit)
          fi

          if [[ -z "$tekst" ]]; then
            echo "Tekst executable not found"
            find build -type f -print
            exit 1
          fi

          if [[ -z "$tk" ]]; then
            echo "TK executable not found"
            find build -type f -print
            exit 1
          fi

          echo "TEKST_PATH=$tekst" >> "$GITHUB_ENV"
          echo "TK_PATH=$tk" >> "$GITHUB_ENV"

      - name: Upload Linux Tekst
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-linux
          path: ${{ env.TEKST_PATH }}
          if-no-files-found: error

      - name: Upload Linux TK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-linux
          path: ${{ env.TK_PATH }}
          if-no-files-found: error

      - name: Upload macOS Tekst
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-macos
          path: ${{ env.TEKST_PATH }}
          if-no-files-found: error

      - name: Upload macOS TK
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-macos
          path: ${{ env.TK_PATH }}
          if-no-files-found: error

      - name: Upload Windows Tekst
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Tekst-windows
          path: ${{ env.TEKST_PATH }}
          if-no-files-found: error

      - name: Upload Windows TK
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TK-windows
          path: ${{ env.TK_PATH }}
          if-no-files-found: error
