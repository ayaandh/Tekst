stages:
  - build
  - test

build-linux:
  stage: build
  image: ubuntu:latest
  script:
    - apt-get update
    - apt-get install -y cmake g++ make
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --config Release
    - |
      if [ -f build/bin/Release/tekst ]; then
        cp build/bin/Release/tekst build/tekst
      elif [ -f build/bin/tekst ]; then
        cp build/bin/tekst build/tekst
      else
        echo "Tekst executable not found"
        exit 1
      fi
    - |
      if [ -f build/bin/Release/tk ]; then
        cp build/bin/Release/tk build/tk
      elif [ -f build/bin/tk ]; then
        cp build/bin/tk build/tk
      else
        echo "tk executable not found"
        exit 1
      fi
  artifacts:
    paths:
      - build/tekst
      - build/tk

github:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache curl jq
    - |
      RESPONSE=$(curl -s -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/ayaandh/Tekst/actions/workflows/build.yml/dispatches" \
        -d '{"ref":"main"}')
    - sleep 5
    - |
      RUN_ID=$(curl -s \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/ayaandh/Tekst/actions/workflows/build.yml/runs?branch=main&event=workflow_dispatch" \
        | jq -r '.workflow_runs[0].id')
      echo "$RUN_ID" > github_run_id.txt
  artifacts:
    paths:
      - github_run_id.txt

collect-github:
  stage: build
  image: alpine:latest
  needs:
    - build-linux
    - github
  script:
    - apk add --no-cache curl jq unzip
    - RUN_ID=$(cat github_run_id.txt)
    - |
      while true; do
        STATUS=$(curl -s \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/ayaandh/Tekst/actions/runs/$RUN_ID" \
          | jq -r '.status')

        CONCLUSION=$(curl -s \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/ayaandh/Tekst/actions/runs/$RUN_ID" \
          | jq -r '.conclusion')

        echo "Status: $STATUS | Conclusion: $CONCLUSION"

        if [ "$STATUS" = "completed" ]; then
          if [ "$CONCLUSION" != "success" ]; then
            echo "GitHub Actions build failed"
            exit 1
          fi
          break
        fi

        sleep 10
      done
    - mkdir -p github-artifacts
    - |
      curl -L \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/ayaandh/Tekst/actions/runs/$RUN_ID/artifacts" \
        -o artifacts.json
    - |
      for NAME in Tekst-macos TK-macos Tekst-windows TK-windows; do
        URL=$(jq -r --arg NAME "$NAME" '.artifacts[] | select(.name == $NAME) | .archive_download_url' artifacts.json)

        if [ "$URL" != "" ] && [ "$URL" != "null" ]; then
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" \
            -o "github-artifacts/$NAME.zip"
          unzip -o "github-artifacts/$NAME.zip" -d "github-artifacts/$NAME"
        else
          echo "Artifact $NAME not found"
          exit 1
        fi
      done
    - mkdir -p build
    - find github-artifacts -type f
    - cp github-artifacts/Tekst-macos/* build/tekst-macos || true
    - cp github-artifacts/TK-macos/* build/tk-macos || true
    - cp github-artifacts/Tekst-windows/* build/tekst.exe || true
    - cp github-artifacts/TK-windows/* build/tk.exe || true
  artifacts:
    paths:
      - build/

test-linux:
  stage: test
  image: ubuntu:latest
  needs:
    - build-linux
  script:
    - chmod +x build/tekst
    - ./build/tekst tests/hello.tk