stages:
  - build

build-linux:
  stage: build
  image: ubuntu:latest
  before_script:
    - apt-get update
    - apt-get install -y cmake g++ make
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --config Release --parallel
    - |
      if [ -f build/bin/Release/tekst ]; then
        cp build/bin/Release/tekst build/tekst
      elif [ -f build/bin/tekst ]; then
        cp build/bin/tekst build/tekst
      else
        echo "tekst was not found"
        exit 1
      fi
    - |
      if [ -f build/bin/Release/tk ]; then
        cp build/bin/Release/tk build/tk
      elif [ -f build/bin/tk ]; then
        cp build/bin/tk build/tk
      else
        echo "tk was not found"
        exit 1
      fi
  artifacts:
    name: "Tekst-linux"
    paths:
      - build/tekst
      - build/tk
    expire_in: 30 days

github:
  stage: build
  image: alpine:latest
  needs:
    - build-linux
  script:
    - apk add --no-cache curl jq
    - |
      RESPONSE=$(curl -sS -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        "https://api.github.com/repos/ayaandh/tekst/actions/workflows/build.yml/dispatches" \
        -d '{"ref":"main"}')

      echo "$RESPONSE"

      RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id')

      if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
        echo "Failed to get GitHub Actions run ID"
        exit 1
      fi

      echo "$RUN_ID" > github_run_id
  artifacts:
    paths:
      - github_run_id
    expire_in: 1 hour

collect-github:
  stage: build
  image: alpine:latest
  needs:
    - build-linux
    - github
  script:
    - apk add --no-cache curl jq unzip
    - |
      RUN_ID=$(cat github_run_id)

      while true; do
        RESPONSE=$(curl -sS \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "https://api.github.com/repos/ayaandh/tekst/actions/runs/$RUN_ID")

        STATUS=$(echo "$RESPONSE" | jq -r '.status')
        CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion')

        echo "Status: $STATUS"
        echo "Conclusion: $CONCLUSION"

        if [ "$STATUS" = "completed" ]; then
          if [ "$CONCLUSION" != "success" ]; then
            echo "GitHub Actions failed"
            exit 1
          fi
          break
        fi

        sleep 10
      done
    - |
      ARTIFACTS=$(curl -sS \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        "https://api.github.com/repos/ayaandh/tekst/actions/runs/$RUN_ID/artifacts")

      echo "$ARTIFACTS" | jq -r '.artifacts[] | "\(.id) \(.name)"'

      for NAME in Tekst-macos TK-macos Tekst-windows TK-windows; do
        ID=$(echo "$ARTIFACTS" | jq -r --arg NAME "$NAME" '.artifacts[] | select(.name == $NAME) | .id')

        if [ -z "$ID" ] || [ "$ID" = "null" ]; then
          echo "Artifact not found: $NAME"
          exit 1
        fi

        curl -L -sS \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "https://api.github.com/repos/ayaandh/tekst/actions/artifacts/$ID/zip" \
          -o "$NAME.zip"

        mkdir -p "$NAME"
        unzip -o "$NAME.zip" -d "$NAME"
        rm "$NAME.zip"
      done

      mkdir -p build

      cp Tekst-macos/tekst build/tekst-macos
      cp TK-macos/tk build/tk-macos
      cp Tekst-windows/tekst.exe build/tekst-windows.exe
      cp TK-windows/tk.exe build/tk-windows.exe
  artifacts:
    name: "Tekst-all-platforms"
    paths:
      - build/tekst
      - build/tk
      - build/tekst-macos
      - build/tk-macos
      - build/tekst-windows.exe
      - build/tk-windows.exe
    expire_in: 30 days