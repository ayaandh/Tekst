stages:
  - sync
  - collect

sync-github:
  stage: sync
  image: alpine:latest
  tags:
    - gitlab-org

  before_script:
    - apk add --no-cache git

  script:
    - |
      git config --global user.name "GitLab CI"
      git config --global user.email "gitlab-ci@users.noreply.github.com"

      git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/ayaandh/tekst.git"

      echo "Syncing GitLab -> GitHub..."

      git push github HEAD:main --force

      echo "GitHub sync complete."

collect-github:
  stage: collect
  image: alpine:latest
  tags:
    - gitlab-org

  before_script:
    - apk add --no-cache curl jq unzip

  script:
    - |
      echo "Waiting for GitHub Actions..."

      sleep 10

      RUN_ID=""

      for i in $(seq 1 60); do
        echo "Checking for GitHub Actions run ($i/60)..."

        RUNS=$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/ayaandh/tekst/actions/runs?event=push&branch=main&per_page=10")

        RUN_ID=$(echo "$RUNS" | jq -r '
          [.workflow_runs[]
           | select(.name == "Multi-Platform Native Build")
           | .id][0] // empty
        ')

        if [ -n "$RUN_ID" ]; then
          echo "Found GitHub Actions run: $RUN_ID"
          break
        fi

        echo "GitHub Actions run not found yet."
        sleep 5
      done

      if [ -z "$RUN_ID" ]; then
        echo "ERROR: GitHub Actions run was not found."
        exit 1
      fi

      echo "Waiting for GitHub Actions run to complete..."

      STATUS=""
      CONCLUSION=""

      for i in $(seq 1 120); do
        RUN=$(curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/ayaandh/tekst/actions/runs/${RUN_ID}")

        STATUS=$(echo "$RUN" | jq -r '.status')
        CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

        echo "GitHub status: ${STATUS}"
        echo "GitHub conclusion: ${CONCLUSION}"

        if [ "$STATUS" = "completed" ]; then
          break
        fi

        sleep 10
      done

      if [ "$STATUS" != "completed" ]; then
        echo "ERROR: GitHub Actions did not finish."
        exit 1
      fi

      if [ "$CONCLUSION" != "success" ]; then
        echo "ERROR: GitHub Actions failed."
        echo "Conclusion: ${CONCLUSION}"
        exit 1
      fi

      echo "GitHub Actions completed successfully."

      mkdir -p artifacts

      echo "Getting GitHub artifacts..."

      curl -fsSL \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/ayaandh/tekst/actions/runs/${RUN_ID}/artifacts" \
        -o artifacts.json

      for ARTIFACT in \
        Tekst-linux \
        TK-linux \
        Tekst-macos \
        TK-macos \
        Tekst-windows \
        TK-windows
      do
        echo "Looking for artifact: ${ARTIFACT}"

        ID=$(jq -r \
          --arg NAME "$ARTIFACT" \
          '[.artifacts[]
           | select(.name == $NAME)
           | .id][0] // empty' \
          artifacts.json)

        if [ -z "$ID" ]; then
          echo "ERROR: Artifact not found: ${ARTIFACT}"
          exit 1
        fi

        echo "Found ${ARTIFACT}: ${ID}"

        curl -fsSL \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/ayaandh/tekst/actions/artifacts/${ID}/zip" \
          -o "artifacts/${ARTIFACT}.zip"

        mkdir -p "artifacts/${ARTIFACT}"

        unzip -q \
          "artifacts/${ARTIFACT}.zip" \
          -d "artifacts/${ARTIFACT}"

        echo "${ARTIFACT} downloaded successfully."
      done

      echo "All artifacts downloaded successfully."

  artifacts:
    name: "Tekst-Linux-macOS-Windows"
    paths:
      - artifacts/Tekst-linux/
      - artifacts/TK-linux/
      - artifacts/Tekst-macos/
      - artifacts/TK-macos/
      - artifacts/Tekst-windows/
      - artifacts/TK-windows/
    expire_in: 30 days
